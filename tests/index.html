<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Arena — testes</title>
<style>
:root{--void:#070910;--ice:#dbeaf5;--dim:#6f8299;--ok:#4dff9e;--bad:#ff3b52;--cyan:#35e0ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--ice);font:14px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;
  padding:32px 20px;max-width:900px;margin:0 auto}
h1{font-size:22px;letter-spacing:.08em;margin-bottom:4px}
h1 span{color:var(--cyan)}
.sub{color:var(--dim);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:26px}
#summary{padding:14px 18px;border-left:3px solid var(--dim);margin-bottom:24px;font-size:16px}
#summary.pass{border-color:var(--ok)}
#summary.fail{border-color:var(--bad)}
.group{margin-bottom:20px}
.group h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);
  margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid rgba(53,224,255,.18)}
.case{display:flex;gap:10px;padding:2px 0}
.case .mark{width:16px;flex:none}
.pass .mark{color:var(--ok)}
.fail .mark{color:var(--bad)}
.fail .name{color:var(--bad)}
.why{color:var(--dim);font-size:12px;padding-left:26px}
</style>
</head>
<body>
<h1>NEON ARENA — <span>testes</span></h1>
<div class="sub">motor web · matemática, colisão e arena</div>
<div id="summary">rodando…</div>
<div id="out"></div>

<script type="module">
import { M4, normalMat3, norm3, cross3, dot3, len3, clamp } from "../src/utils.js";
import { ARENA, boxes, buildArena, rayAABB, raySphere, pushOut, groundAt, blocked, insideAnyBox }
  from "../src/world.js";

/* ---------- mini framework: o suficiente, nada além ---------- */
const results = [];
let current = "geral";
const group = name => { current = name; };
const test = (name, fn) => {
  try { fn(); results.push({ group: current, name, ok: true }); }
  catch (e) { results.push({ group: current, name, ok: false, why: e.message }); }
};
function assert(cond, msg){ if (!cond) throw new Error(msg || "esperava verdadeiro"); }
function near(a, b, tol, msg){
  if (Math.abs(a - b) > (tol ?? 1e-4))
    throw new Error(`${msg || "valor"}: esperava ${b}, veio ${a}`);
}

/* ---------- matrizes ---------- */
group("matrizes 4x4");

test("identidade não muda nada", () => {
  const m = M4.mul(M4.ident(), M4.trans(3, 4, 5));
  near(m[12], 3); near(m[13], 4); near(m[14], 5);
});

test("multiplicação não é comutativa", () => {
  const a = M4.trans(1, 0, 0), b = M4.rotY(Math.PI / 2);
  const ab = M4.mul(a, b), ba = M4.mul(b, a);
  assert(Math.abs(ab[12] - ba[12]) > 1e-6 || Math.abs(ab[14] - ba[14]) > 1e-6,
    "as duas ordens deram o mesmo resultado");
});

test("rotação de 90° em Y leva +X para -Z", () => {
  const m = M4.rotY(Math.PI / 2);
  // coluna 0 é para onde o eixo X vai parar
  near(m[0], 0, 1e-6, "x.x"); near(m[2], -1, 1e-6, "x.z");
});

test("quatro rotações de 90° voltam ao início", () => {
  let m = M4.ident();
  for (let i = 0; i < 4; i++) m = M4.mul(m, M4.rotY(Math.PI / 2));
  for (let i = 0; i < 16; i++) near(m[i], M4.ident()[i], 1e-5, `elemento ${i}`);
});

test("perspectiva tem a forma esperada", () => {
  const p = M4.persp(Math.PI / 2, 1, 0.1, 100);
  near(p[0], 1, 1e-6, "escala x");
  near(p[5], 1, 1e-6, "escala y");
  near(p[11], -1, 1e-6, "w = -z");
});

test("matriz normal corrige escala não uniforme", () => {
  // um cubo achatado em Y: a normal do topo tem de continuar apontando para cima
  const model = M4.scale(4, 0.25, 4);
  const n = normalMat3(model);
  const up = [n[3] * 0 + n[4] * 1 + n[5] * 0, 0, 0];
  const ny = [n[1] * 0 + n[4] * 1 + n[7] * 0];
  assert(ny[0] > 0, "a normal virou para baixo");
  // e a componente horizontal continua nula
  near(n[3] * 1, 0, 1e-6, "vazou em x");
});

test("alignZ aponta o eixo Z para o vetor pedido", () => {
  const dir = norm3([1, 2, 3]);
  const m = M4.alignZ(dir);
  near(m[8], dir[0], 1e-5); near(m[9], dir[1], 1e-5); near(m[10], dir[2], 1e-5);
});

test("alignZ devolve base ortonormal", () => {
  const m = M4.alignZ(norm3([0.3, -0.9, 0.2]));
  const x = [m[0], m[1], m[2]], y = [m[4], m[5], m[6]], z = [m[8], m[9], m[10]];
  near(len3(x), 1, 1e-5, "|x|"); near(len3(y), 1, 1e-5, "|y|"); near(len3(z), 1, 1e-5, "|z|");
  near(dot3(x, y), 0, 1e-5, "x·y"); near(dot3(x, z), 0, 1e-5, "x·z");
});

/* ---------- raios ---------- */
group("interseções");

const unit = { min: [-1, -1, -1], max: [1, 1, 1] };

test("raio acerta a caixa de frente", () => {
  near(rayAABB([0, 0, -5], [0, 0, 1], unit.min, unit.max), 4);
});

test("raio ao contrário não acerta", () => {
  assert(rayAABB([0, 0, -5], [0, 0, -1], unit.min, unit.max) === Infinity, "acertou pelas costas");
});

test("raio passando por fora não acerta", () => {
  assert(rayAABB([0, 5, -5], [0, 0, 1], unit.min, unit.max) === Infinity, "acertou fora da caixa");
});

test("origem dentro da caixa dá distância zero", () => {
  near(rayAABB([0, 0, 0], [1, 0, 0], unit.min, unit.max), 0);
});

test("raio acerta a esfera", () => {
  near(raySphere([0, 0, -10], [0, 0, 1], [0, 0, 0], 1), 9);
});

test("raio erra a esfera por pouco", () => {
  assert(raySphere([0, 1.01, -10], [0, 0, 1], [0, 0, 0], 1) === Infinity, "acertou de raspão demais");
});

test("esfera atrás do raio não conta", () => {
  assert(raySphere([0, 0, 10], [0, 0, 1], [0, 0, 0], 1) === Infinity, "acertou para trás");
});

/* ---------- colisão ---------- */
group("colisão e arena");

test("empurrão tira o jogador de dentro do engradado", () => {
  buildArena();
  const p = [-24, 0, -6];          // centro de um engradado da planta
  pushOut(p, 0.42, 0, 1.7);
  const dist = Math.max(Math.abs(p[0] + 24), Math.abs(p[2] + 6));
  assert(dist > 1, `continuou dentro: ${dist.toFixed(2)}`);
});

test("quem está longe não é empurrado", () => {
  buildArena();
  const p = [3, 0, 20], antes = p.slice();
  pushOut(p, 0.42, 0, 1.7);
  near(p[0], antes[0], 1e-6, "x"); near(p[2], antes[2], 1e-6, "z");
});

test("chão sobe em cima do engradado", () => {
  buildArena();
  assert(groundAt([-24, 2.2, -6], 0.42) > 2, "não reconheceu o topo do engradado");
});

test("chão é zero em espaço aberto", () => {
  buildArena();
  near(groundAt([-28, 0, 28], 0.42), 0);
});

test("cobertura bloqueia a linha de visão", () => {
  buildArena();
  assert(blocked([0, 1.68, 0], [0, 1.7, -20]), "enxergou através da cobertura");
});

test("espaço aberto não bloqueia", () => {
  buildArena();
  assert(!blocked([-20, 1.68, -20], [-20, 1.7, -14]), "bloqueou o que era caminho livre");
});

test("as paredes fecham o perímetro", () => {
  buildArena();
  const limite = (ARENA + 2) * 1.4143;
  for (let i = 0; i < 36; i++) {
    const a = i * Math.PI / 18;
    const dir = [Math.cos(a), 0, Math.sin(a)];
    let best = Infinity;
    for (const b of boxes) best = Math.min(best, rayAABB([0, 5, 0], dir, b.min, b.max));
    assert(best < limite, `vazou no ângulo ${i * 10}° (${best.toFixed(1)})`);
  }
});

test("ponto dentro de caixa não está livre", () => {
  buildArena();
  assert(insideAnyBox(0, 0, 0.5), "a plataforma central sumiu");
});

test("arena tem geometria suficiente", () => {
  buildArena();
  assert(boxes.length > 25, `só ${boxes.length} caixas`);
});

/* ---------- utilitários ---------- */
group("utilitários");

test("clamp prende nas duas pontas", () => {
  near(clamp(-5, 0, 1), 0); near(clamp(5, 0, 1), 1); near(clamp(0.5, 0, 1), 0.5);
});

test("normalizar dá comprimento 1", () => {
  near(len3(norm3([3, 4, 12])), 1, 1e-6);
});

test("normalizar vetor nulo não vira NaN", () => {
  const n = norm3([0, 0, 0]);
  assert(n.every(v => Number.isFinite(v)), "virou NaN");
});

test("produto vetorial segue a mão direita", () => {
  const c = cross3([1, 0, 0], [0, 1, 0]);
  near(c[0], 0); near(c[1], 0); near(c[2], 1);
});

/* ---------- relatório ---------- */
const out = document.getElementById("out");
const groups = [...new Set(results.map(r => r.group))];
for (const g of groups) {
  const div = document.createElement("div");
  div.className = "group";
  div.innerHTML = `<h2>${g}</h2>` + results.filter(r => r.group === g).map(r =>
    `<div class="case ${r.ok ? "pass" : "fail"}">
       <span class="mark">${r.ok ? "✓" : "✕"}</span><span class="name">${r.name}</span>
     </div>` + (r.ok ? "" : `<div class="why">${r.why}</div>`)
  ).join("");
  out.appendChild(div);
}

const failed = results.filter(r => !r.ok).length;
const summary = document.getElementById("summary");
summary.className = failed ? "fail" : "pass";
summary.textContent = failed
  ? `${failed} de ${results.length} testes falharam`
  : `${results.length} testes, todos passando`;

// deixa o resultado legível por automação
window.__testResults = { total: results.length, failed, results };
document.title = failed ? `✕ ${failed} falhas` : `✓ ${results.length} ok`;
</script>
</body>
</html>
